<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junkyard Jump</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}
canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
</style>
</head>
<body>
<canvas id="game" width="425" height="290"></canvas>
<script>
// Classic (default) plays the original Score with the ported Lingo: classic.js.
// Modern is the reimagined rebuild: game.js. The splash toggle switches and reloads.
(function () {
  var mode = localStorage.getItem('jj-mode') === 'modern' ? 'modern' : 'classic';
  var files = mode === 'modern'
    ? ['kids-font.js', 'engine-audio.js', 'modern-gauges.js', 'modern-jump.js', 'game.js']
    : ['kids-font.js', 'classic.js'];
  // bump VERSION on each release so browsers don't keep running stale scripts
  var VERSION = '2026-10-23b';
  files.forEach(function (f) { var s = document.createElement('script'); s.src = f + '?v=' + VERSION; s.async = false; document.body.appendChild(s); });
})();
</script>
</body>
</html>
